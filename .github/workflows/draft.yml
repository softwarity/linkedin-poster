name: Draft

# Sends posts to Slack #linkedin-posts for approval:
#   - automatically, for every post file added on main (posts/<project>/<slug>/<lang>.txt)
#   - by hand: gh workflow run draft.yml -f post=posts/plug/intro/fr.txt
# The image, if any, is the image.{gif,png,jpg} next to the text file.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["posts/**/*.txt"]
  workflow_dispatch:
    inputs:
      post:
        description: "Text file of the post: posts/<project>/<slug>/<lang>.txt"
        required: true

env:
  WORKER_URL: https://linkedin-softwarity-oauth.francois-achache.workers.dev

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Send drafts
        env:
          POST: ${{ inputs.post }}
          BEFORE: ${{ github.event.before }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
        run: |
          if [ -n "$POST" ]; then
            posts=$POST
          else
            # Only files ADDED by this push: editing a published post never re-sends it.
            # A new branch has no "before": compare it with main instead.
            base=$BEFORE
            if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then base=$(git merge-base origin/main HEAD); fi
            posts=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'posts/*/*/??.txt')
          fi
          for post in $posts; do .github/scripts/send-draft.sh "$post"; done
