# Slack app manifest — api.slack.com/apps → Create New App → From a manifest.
# Replace <WORKER_URL> with the Worker URL (https://linkedin-softwarity-oauth.<subdomain>.workers.dev).
display_information:
  name: LinkedIn Poster
  description: Validation des posts LinkedIn Softwarity avant publication
features:
  bot_user:
    display_name: linkedin-poster
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
    request_url: <WORKER_URL>/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
